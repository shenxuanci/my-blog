# 每日新闻日报：定时生成数据并推送上线
#
# - cron 为 UTC 时间，23:00 UTC = 北京 07:00（GitHub 高峰期可能延迟 15-60 分钟）
# - 需要仓库 Secret: STEPFUN_API_KEY、DEEPSEEK_API_KEY
#   自建 RSSHub 源需再加两个 Secret: RSSHUB_BASE（实例地址）、RSSHUB_KEY（ACCESS_KEY）
# - 手动补跑：Actions 页面选本 workflow -> Run workflow
# - 本 workflow 是 CLAUDE.md「严禁自动 push」规则的唯一例外，
#   仅允许提交 source/news/data/ 路径，脚本内置数据校验，校验失败则不提交。
name: Daily News Briefing

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: validate 只验收不发布；publish 显式发布
        required: true
        type: choice
        default: validate
        options:
          - validate
          - publish
      shadow_mode:
        description: auto 按验收门运行；force 强制运行；skip 显式跳过
        required: true
        type: choice
        default: auto
        options:
          - auto
          - force
          - skip

permissions:
  contents: read

concurrency:
  group: daily-news
  cancel-in-progress: false

env:
  RUNTIME_ENVIRONMENT_EPOCH: "1"

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.publish.outputs.committed }}
      published_date: ${{ steps.publish.outputs.published_date }}
    env:
      TZ: Asia/Shanghai
      RUN_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare run data
        id: run_data
        shell: bash
        env:
          VALIDATION_DATA_DIR: ${{ runner.temp }}/daily-news-validation-data
          PUBLISH_DATA_DIR: ${{ github.workspace }}/source/news/data
        run: |
          if [[ "$RUN_MODE" == "validate" ]]; then
            mkdir -p "$VALIDATION_DATA_DIR"
            cp -a source/news/data/. "$VALIDATION_DATA_DIR/"
            echo "data_dir=$VALIDATION_DATA_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "data_dir=$PUBLISH_DATA_DIR" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: news-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install --require-hashes -r news-pipeline/requirements.txt

      - name: Generate daily briefing
        env:
          STEPFUN_API_KEY: ${{ secrets.STEPFUN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RSSHUB_BASE: ${{ secrets.RSSHUB_BASE }}
          RSSHUB_KEY: ${{ secrets.RSSHUB_KEY }}
          DATA_DIR: ${{ steps.run_data.outputs.data_dir }}
          ROLLOUT_EVIDENCE_PATH: ${{ runner.temp }}/rollout-evidence.json
        run: python news-pipeline/daily_news.py

      - name: Upload generated data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-news-data
          path: ${{ steps.run_data.outputs.data_dir }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload rollout evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rollout-evidence
          path: ${{ runner.temp }}/rollout-evidence.json
          if-no-files-found: warn
          retention-days: 3

      # CLAUDE.md 把这一步列为「严禁自动 push」的唯一例外，例外的边界在代码里画死：
      # 只在 main 上跑、只提交 source/news/data、只推 main。
      - name: Commit and push
        id: publish
        if: ${{ env.RUN_MODE == 'publish' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source/news/data
          if git diff --cached --quiet; then
            echo "No data changes, skip commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 在 push 前从 manifest 合同中取出发布日期。不能使用 grep | head：
          # Actions 的 pipefail 会把 head 提前关管道造成的 SIGPIPE 判成失败。
          published_date="$(
            python3 - <<'PY'
          import re
          from pathlib import Path

          manifest = Path("source/news/data/manifest.js").read_text(encoding="utf-8")
          match = re.search(
              r'^window\.NEWS_MANIFEST\s*=\s*\[\s*"(\d{4}-\d{2}-\d{2})"',
              manifest,
              re.MULTILINE,
          )
          if not match:
              raise SystemExit("manifest does not start with a published date")
          print(match.group(1))
          PY
          )"
          git commit -m "Update daily briefing data ($(date +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          # 部署校验要等的是"刚发布的那一天"，不是它自己跑起来时的今天——
          # 跨零点的手动发布下两者会不同，用 date 会误判成没上线。
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "published_date=$published_date" >> "$GITHUB_OUTPUT"

  # 数据推上 main 不等于线上能读到：2026-08-01 机器人提交 2623d4c 后 Vercel
  # 没有收到 webhook，日报在 main 上完好却一整天没上线，而且完全静默。
  # 本 job 刻意独立：rollout-review 的 publication 取自 generate 的结果，把部署
  # 校验塞进 generate 会让 Vercel 打个嗝就把当天判成发布失败、五门归零。
  deploy-check:
    needs: [generate]
    if: ${{ needs.generate.result == 'success' && github.ref == 'refs/heads/main' && needs.generate.outputs.committed == 'true' }}
    runs-on: ubuntu-24.04
    # 两轮各 10 分钟的轮询加上钩子调用，上界约 21 分钟；留出余量。
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TZ: Asia/Shanghai
      SITE_MANIFEST: https://www.aoiblog.top/news/data/manifest.js
      PUBLISHED_DATE: ${{ needs.generate.outputs.published_date }}
    steps:
      - name: Wait for the briefing to go live
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${PUBLISHED_DATE:-}" ]; then
            echo "::error::generate reported a commit but no published date; cannot verify."
            exit 1
          fi
          echo "Expecting $PUBLISHED_DATE in $SITE_MANIFEST"
          MAX_RESPONSE_BYTES=65536

          # www 是生产主域；这里刻意不跟随重定向，域名合同漂移必须显式失败。
          live() {
            local manifest_body
            if ! manifest_body="$(curl -fsS --max-time 20 --max-filesize "$MAX_RESPONSE_BYTES" "$SITE_MANIFEST" 2>/dev/null)"; then
              return 1
            fi
            grep -Fq "window.NEWS_MANIFEST = [\"${PUBLISHED_DATE}\"" <<< "$manifest_body"
          }

          # 按墙钟设上界，循环次数不再隐含在 sleep 与 curl 超时的乘积里。
          poll() {
            deadline=$(( $(date +%s) + $1 ))
            while [ "$(date +%s)" -lt "$deadline" ]; do
              if live; then return 0; fi
              sleep 20
            done
            return 1
          }

          if poll 600; then
            echo "Briefing for $PUBLISHED_DATE is live."
            exit 0
          fi

          diagnostic_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/daily-news-deploy-check.XXXXXX")"
          hook_response_file="$diagnostic_dir/hook-response.json"
          diagnostic_headers="$diagnostic_dir/headers"
          diagnostic_body="$diagnostic_dir/body"
          cleanup() {
            rm -f "$hook_response_file" "$diagnostic_headers" "$diagnostic_body"
            rmdir "$diagnostic_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          header_value() {
            local wanted="$1"
            awk -v wanted="$wanted" '
              {
                line = $0
                sub(/\r$/, "", line)
                key = line
                sub(/:.*/, "", key)
                if (tolower(key) == tolower(wanted)) {
                  sub(/^[^:]*:[[:space:]]*/, "", line)
                  value = line
                }
              }
              END {
                if (value != "") print value
                else print "<missing>"
              }
            ' "$diagnostic_headers"
          }

          diagnose() {
            local diagnostic_metrics curl_exit response_preview
            : > "$diagnostic_headers"
            : > "$diagnostic_body"
            if diagnostic_metrics="$(
              curl -sS --max-time 20 --max-filesize "$MAX_RESPONSE_BYTES" \
                --dump-header "$diagnostic_headers" \
                --output "$diagnostic_body" \
                --write-out 'http_code=%{http_code} url_effective=%{url_effective} num_redirects=%{num_redirects}' \
                "$SITE_MANIFEST"
            )"; then
              curl_exit=0
            else
              curl_exit=$?
            fi
            echo "Probe diagnostic: curl_exit=$curl_exit ${diagnostic_metrics:-metrics_unavailable}"
            printf 'Probe headers: Location=%s X-Vercel-Cache=%s Age=%s ETag=%s Last-Modified=%s\n' \
              "$(header_value Location)" \
              "$(header_value X-Vercel-Cache)" \
              "$(header_value Age)" \
              "$(header_value ETag)" \
              "$(header_value Last-Modified)"
            response_preview="$(head -c 200 "$diagnostic_body" | tr '\r\n' '  ')"
            printf 'Probe response_preview=%s\n' "${response_preview:-<empty>}"
          }

          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::error::$PUBLISHED_DATE is on main but not live, and no VERCEL_DEPLOY_HOOK is configured."
            echo "Add the deploy hook secret to let this job self-heal."
            diagnose
            exit 1
          fi

          echo "::warning::Not live after 10 minutes; triggering the Vercel deploy hook."
          : > "$hook_response_file"
          if hook_http_code="$(
            curl -sS --max-time 30 --max-filesize "$MAX_RESPONSE_BYTES" -X POST \
              --output "$hook_response_file" \
              --write-out '%{http_code}' \
              "$DEPLOY_HOOK"
          )"; then
            hook_curl_exit=0
          else
            hook_curl_exit=$?
          fi

          if [ "$hook_curl_exit" -ne 0 ]; then
            echo "::warning::Deploy hook call failed with curl exit $hook_curl_exit; still checking whether the site updates."
          elif [[ ! "$hook_http_code" =~ ^2[0-9][0-9]$ ]]; then
            echo "::warning::Deploy hook returned HTTP $hook_http_code; still checking whether the site updates."
          elif hook_metadata="$(
            python3 - "$hook_response_file" <<'PY'
          import json
          import re
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as handle:
                  payload = json.load(handle)
              job = payload["job"]
              job_id = job["id"]
              state = job["state"]
              created_at = job["createdAt"]
          except (OSError, KeyError, TypeError, ValueError, json.JSONDecodeError):
              raise SystemExit(1)

          if not isinstance(job_id, str) or not re.fullmatch(r"[A-Za-z0-9_-]{1,128}", job_id):
              raise SystemExit(1)
          if not isinstance(state, str) or not re.fullmatch(r"[A-Z_]{1,32}", state):
              raise SystemExit(1)
          if type(created_at) is not int or created_at < 0:
              raise SystemExit(1)

          print(f"id={job_id} state={state} createdAt={created_at}")
          PY
          )"; then
            echo "Deploy hook accepted: $hook_metadata"
          else
            echo "::warning::Deploy hook returned HTTP $hook_http_code but its job metadata was unusable; still checking whether the site updates."
          fi

          if poll 600; then
            echo "Briefing for $PUBLISHED_DATE is live after the deploy hook."
            exit 0
          fi

          diagnose
          echo "::error::$PUBLISHED_DATE is still not live after the deploy hook. Check Vercel."
          exit 1

  shadow-policy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run_shadow: ${{ steps.decide.outputs.run_shadow }}
      skipped_outcome: ${{ steps.decide.outputs.skipped_outcome }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Reads no issue state since ADR 0016 -- the verdict is a constant, so this
      # needs neither `issues: read` nor a token. Keeping them would only let a
      # rate-limited API call fail the step, which fail-opens into a paid run.
      - name: Read shadow gate status
        id: gate
        continue-on-error: true
        run: python news-pipeline/issue_ledger.py shadow-status --issue 15

      - name: Decide shadow policy
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode }}
          SHADOW_MODE: ${{ inputs.shadow_mode }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_ACCEPTED: ${{ steps.gate.outputs.accepted }}
        run: |
          run_shadow=false
          skipped_outcome=failure
          shadow_mode="${SHADOW_MODE:-auto}"

          if [[ "$shadow_mode" == "force" ]]; then
            run_shadow=true
          elif [[ "$shadow_mode" == "skip" ]]; then
            run_shadow=false
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$RUN_MODE" == "validate" ]]; then
            run_shadow=false
          elif [[ "$GATE_OUTCOME" != "success" ]]; then
            echo "::warning::Shadow gate status lookup failed; running bounded shadow."
            run_shadow=true
          elif [[ "$GATE_ACCEPTED" == "true" ]]; then
            run_shadow=false
            skipped_outcome=accepted
          else
            run_shadow=true
          fi

          echo "run_shadow=$run_shadow" >> "$GITHUB_OUTPUT"
          echo "skipped_outcome=$skipped_outcome" >> "$GITHUB_OUTPUT"

  shadow:
    needs: [generate, shadow-policy]
    if: ${{ always() && needs.generate.result == 'success' && needs.shadow-policy.outputs.run_shadow == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
    permissions:
      contents: read
    env:
      TZ: Asia/Shanghai
      SHADOW_STATUS_PATH: /tmp/daily-news-shadow-status.json
      SHADOW_SUMMARY_PATH: /tmp/daily-news-shadow-summary.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download generated data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-news-data
          path: ${{ runner.temp }}/generated-news-data

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: news-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install --require-hashes -r news-pipeline/requirements.txt

      - name: Run objectivity shadow
        id: shadow_run
        continue-on-error: ${{ github.event_name == 'schedule' || inputs.mode == 'publish' }}
        env:
          STEPFUN_API_KEY: ${{ secrets.STEPFUN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RSSHUB_BASE: ${{ secrets.RSSHUB_BASE }}
          RSSHUB_KEY: ${{ secrets.RSSHUB_KEY }}
          DATA_DIR: ${{ runner.temp }}/generated-news-data
        run: python news-pipeline/daily_news.py --objectivity-shadow

      - name: Record shadow status
        if: ${{ always() }}
        env:
          SHADOW_OUTCOME: ${{ steps.shadow_run.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          outcome = os.environ.get("SHADOW_OUTCOME") or "not_run"
          target = Path(os.environ["SHADOW_STATUS_PATH"])
          target.write_text(
              json.dumps({"outcome": outcome}, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload shadow status
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-status
          path: ${{ env.SHADOW_STATUS_PATH }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload shadow summary
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-summary
          path: ${{ env.SHADOW_SUMMARY_PATH }}
          if-no-files-found: warn
          retention-days: 3

  rollout-review:
    needs: [generate, shadow-policy, shadow]
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.mode == 'publish') }}
    continue-on-error: true
    concurrency:
      group: daily-news-rollout-ledger
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    env:
      TZ: Asia/Shanghai
      REVIEW_DIR: /tmp/daily-news-rollout-review
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main

      - name: Check rollout issue
        id: issue
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python news-pipeline/issue_ledger.py check-open --issue 15

      - name: Download rollout evidence
        if: ${{ steps.issue.outputs.open == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rollout-evidence
          path: ${{ env.REVIEW_DIR }}/rollout-evidence

      - name: Download shadow status
        if: ${{ steps.issue.outputs.open == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shadow-status
          path: ${{ env.REVIEW_DIR }}/shadow-status

      - name: Download shadow summary
        if: ${{ steps.issue.outputs.open == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shadow-summary
          path: ${{ env.REVIEW_DIR }}/shadow-summary

      - name: Prepare rollout review
        id: prepare
        if: ${{ steps.issue.outputs.open == 'true' }}
        env:
          GENERATE_RESULT: ${{ needs.generate.result }}
          EVIDENCE_PATH: ${{ env.REVIEW_DIR }}/rollout-evidence/rollout-evidence.json
          SHADOW_STATUS_PATH: ${{ env.REVIEW_DIR }}/shadow-status/daily-news-shadow-status.json
          SKIPPED_SHADOW_OUTCOME: ${{ needs.shadow-policy.outputs.skipped_outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          evidence = Path(os.environ["EVIDENCE_PATH"])
          generate_result = os.environ.get("GENERATE_RESULT", "failure")
          publication = "success"
          reason = ""
          judge_ready = generate_result == "success" and evidence.is_file()
          if generate_result != "success":
              publication = "failure"
              reason = f"generate job {generate_result}"
          elif not evidence.is_file():
              publication = "failure"
              reason = "rollout evidence artifact missing"

          shadow_outcome = (
              "accepted"
              if os.environ.get("SKIPPED_SHADOW_OUTCOME") == "accepted"
              else "failure"
          )
          try:
              status = json.loads(Path(os.environ["SHADOW_STATUS_PATH"]).read_text(
                  encoding="utf-8"))
              if status.get("outcome") == "success":
                  shadow_outcome = "success"
          except (OSError, TypeError, ValueError):
              pass

          outputs = {
              "date": datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat(),
              "judge_ready": str(judge_ready).lower(),
              "publication": publication,
              "publication_reason": reason,
              "shadow_outcome": shadow_outcome,
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              for name, value in outputs.items():
                  handle.write(f"{name}={value}\n")
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: setup
        if: ${{ steps.issue.outputs.open == 'true' && steps.prepare.outputs.judge_ready == 'true' }}
        continue-on-error: true
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: news-pipeline/requirements.txt

      - name: Install review dependencies
        id: install
        if: ${{ steps.issue.outputs.open == 'true' && steps.prepare.outputs.judge_ready == 'true' && steps.setup.outcome == 'success' }}
        continue-on-error: true
        run: pip install --require-hashes -r news-pipeline/requirements.txt

      - name: Evaluate rollout
        id: judge
        if: ${{ steps.issue.outputs.open == 'true' && steps.prepare.outputs.judge_ready == 'true' && steps.setup.outcome == 'success' && steps.install.outcome == 'success' }}
        continue-on-error: true
        env:
          STEPFUN_API_KEY: ${{ secrets.STEPFUN_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SHADOW_OUTCOME: ${{ steps.prepare.outputs.shadow_outcome }}
          EVIDENCE_PATH: ${{ env.REVIEW_DIR }}/rollout-evidence/rollout-evidence.json
          REPORT_PATH: ${{ env.REVIEW_DIR }}/rollout-report.json
        run: |
          python news-pipeline/rollout_validation.py \
            --evidence "$EVIDENCE_PATH" \
            --shadow-outcome "$SHADOW_OUTCOME" \
            --output "$REPORT_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          statuses = {
              report.get("selection", {}).get("status"),
              report.get("trajectory", {}).get("status"),
          }
          if "needs_review" in statuses:
              print("::warning::Rollout Judge needs review; the Issue ledger will record it.")
          PY

      - name: Upload rollout report
        if: ${{ always() && steps.issue.outputs.open == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rollout-report
          path: ${{ env.REVIEW_DIR }}/rollout-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Update rollout issue ledger
        id: ledger
        if: ${{ always() && steps.issue.outputs.open == 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ env.REVIEW_DIR }}/rollout-report.json
          REVIEW_DATE: ${{ steps.prepare.outputs.date }}
          PUBLICATION: ${{ steps.prepare.outputs.publication }}
          PUBLICATION_REASON: ${{ steps.prepare.outputs.publication_reason }}
          SHADOW_OUTCOME: ${{ steps.prepare.outputs.shadow_outcome }}
          SHADOW_SUMMARY: ${{ env.REVIEW_DIR }}/shadow-summary/daily-news-shadow-summary.json
          QUALITY_HEALTH: ${{ github.workspace }}/source/news/data/quality-health.json
          SOURCE_HEALTH: ${{ github.workspace }}/source/news/data/source_health.json
        run: |
          python news-pipeline/issue_ledger.py sync \
            --issue 15 \
            --date "$REVIEW_DATE" \
            --publication "$PUBLICATION" \
            --publication-reason "$PUBLICATION_REASON" \
            --report "$REPORT_PATH" \
            --shadow-summary "$SHADOW_SUMMARY" \
            --shadow-outcome "$SHADOW_OUTCOME" \
            --quality-health "$QUALITY_HEALTH" \
            --source-health "$SOURCE_HEALTH" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --sha "${{ github.sha }}"

      - name: Warn on review failure
        if: ${{ always() && (steps.issue.outcome == 'failure' || steps.setup.outcome == 'failure' || steps.install.outcome == 'failure' || steps.judge.outcome == 'failure' || steps.ledger.outcome == 'failure') }}
        run: echo "::warning::Rollout review or Issue ledger update failed; publication was not blocked."
