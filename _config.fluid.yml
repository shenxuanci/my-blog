favicon: /favicon.svg
apple_touch_icon: /images/my-avatar.jpg

navbar:
  blog_title: Aoitsuki
  menu:
    - { key: "home", name: "首页", link: "/", icon: "iconfont icon-home-fill" }
    - { key: "archive", name: "归档", link: "/archives/", icon: "iconfont icon-archive-fill" }
    - { key: "category", name: "分类", link: "/categories/", icon: "iconfont icon-category-fill" }
    - { key: "about", name: "关于", link: "/about/", icon: "iconfont icon-user-fill" }
    - { key: "links", name: "友链", link: "/friends/", icon: "iconfont icon-link-fill" }
    - { key: "guestbook", name: "留言", link: "/guestbook/", icon: "iconfont icon-comment" }
    - { key: "news", name: "日报", link: "/news/" }

search:
  enable: true

fun_features:
  typing:
    # 文章标题必须立即完整可见；其余页面继续沿用 Fluid 的打字效果
    scope: [home, archives, categories, tags, about, links, page, 404]

index:
  banner_img: /images/img_1774022028502.png
  banner_img_height: 80
  slogan:
    enable: true
    text: "乌幕屏，海相续，举眼茫茫，静听细浪语"

post:
  default_index_img: /images/covers/defaults/fallback.webp
  banner_img: /images/img_1774022028502.png
  banner_img_height: 55
  comments:
    enable: true
    type: twikoo
  toc:
    # 关闭 tocbot 高亮项变化时的自动滚动，避免手动翻看目录后被拽回当前标题
    disableTocScrollSync: true
  copyright:
    update_date:
      enable: true
  category_bar:
    # 主题默认 specific: true，要求文章 front-matter 声明 category_bar: true 才显示，
    # 本站文章都没有该字段，等于侧边栏从未渲染，这里改为对所有文章开启
    specific: false
    post_order_by: "date"
  meta:
    author:
      enable: false
    date:
      enable: true
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 300
    views:
      enable: false

code:
  highlight:
    highlightjs:
      # 主题默认的 "dark" 只给 4 组 token 上色，`.hljs-subst` 等干脆是空规则，
      # 未命中的 token 只能继承前景色，在深色背景上糊成一片。
      # atom one dark 覆盖全部 token 类型，且偏灰蓝的底色压得住本站的暖色纸感。
      style_dark: "atom one dark"

archive:
  banner_img: /images/img_1774022028502.png
  banner_img_height: 55

category:
  enable: true
  banner_img: /images/img_1774022028502.png
  banner_img_height: 55

about:
  enable: true
  banner_img: /images/img_1774022028502.png
  banner_img_height: 55
  avatar: /images/my-avatar.jpg
  name: "Aoitsuki"
  intro: "一名富有人文情怀的工科生"
  icons:
    - { class: "iconfont icon-github-fill", link: "https://github.com/shenxuanci", tip: "GitHub" }
    - { class: "iconfont icon-mail", link: "mailto:antemeridiem@foxmail.com", tip: "Email" }

links:
  enable: false

page:
  banner_img: /images/img_1774022028502.png
  banner_img_height: 55

twikoo:
  envId: https://twikoo.aoiblog.top
  # 不要在这里配置 path：Fluid 模板会把它当字面量字符串输出。
  # 评论 path 由 scripts/twikoo-path.js 按文章 front-matter 的 twikooPath 决定。

custom_js:
  - /js/twikoo-legacy-path.js
  - /js/aoiblog-home.js

custom_css:
  - /css/aoiblog-home.css
  - /css/aoiblog-post.css

footer:
  content: "<span>Aoitsuki</span>"
