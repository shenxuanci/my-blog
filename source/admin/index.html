<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客后台 - Aoitsuki</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --line: #d9e1ec;
      --text: #263242;
      --muted: #66758a;
      --primary: #286f8f;
      --primary-dark: #1e566f;
      --danger: #bd3d3a;
      --shadow: 0 18px 42px rgba(37, 45, 56, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      line-height: 1.6;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button,
    .link-button {
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 0.45rem 0.9rem;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
    }

    button:hover,
    .link-button:hover {
      background: var(--primary-dark);
    }

    button.secondary,
    .link-button.secondary {
      border-color: var(--line);
      background: #fff;
      color: var(--text);
    }

    button.secondary:hover,
    .link-button.secondary:hover {
      background: var(--surface-soft);
    }

    button.danger {
      background: var(--danger);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.66;
    }

    .hidden {
      display: none !important;
    }

    .login {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 1.5rem;
    }

    .login-panel {
      width: min(420px, 100%);
      padding: 2rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .login-panel h1,
    .topbar h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .login-panel form {
      display: grid;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .shell {
      width: min(1280px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 1.2rem 0 2rem;
    }

    .topbar,
    .toolbar,
    .workspace,
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.2rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin: 1rem 0;
      padding: 0.9rem 1rem;
    }

    .status {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .view-button.active {
      border-color: rgba(40, 111, 143, 0.22);
      background: #e7f3f6;
      color: var(--primary-dark);
    }

    .workspace {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      /* 必须是 clip 而不是 hidden：两者都能裁掉文章列表的方角，但 hidden 会创建滚动容器，
         让 .form-actions 的 sticky 以这个自身不滚动的祖先为参照系——底栏会静默失效，不报错。 */
      overflow: clip;
    }

    .article-list {
      min-height: 720px;
      border-right: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .article-item {
      width: 100%;
      min-height: 92px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      padding: 0.9rem 1rem;
      background: transparent;
      color: var(--text);
      text-align: left;
    }

    .article-item:hover,
    .article-item.active {
      background: #edf6f8;
    }

    .article-title {
      display: block;
      font-weight: 700;
    }

    .article-meta {
      display: block;
      margin-top: 0.35rem;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .editor {
      min-width: 0;
      padding: 1.2rem;
    }

    .empty {
      display: grid;
      min-height: 540px;
      place-items: center;
      color: var(--muted);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 1rem;
    }

    .field {
      display: grid;
      gap: 0.4rem;
      margin-bottom: 1rem;
    }

    label {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.65rem 0.75rem;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 420px;
      resize: vertical;
      font-family: Consolas, "SFMono-Regular", monospace;
      line-height: 1.7;
    }

    .cover-row {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
    }

    .cover-preview {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-soft);
    }

    .cover-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    .inline-actions.spaced-above {
      margin-top: 0.75rem;
    }

    .inline-actions.spaced-below {
      margin-bottom: 0.75rem;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
    }

    .preview {
      min-height: 420px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 1rem;
      background: var(--surface-soft);
    }

    .preview > p:not(:has(img)) {
      text-indent: 2em;
    }

    .preview img {
      max-width: 100%;
      border-radius: 6px;
    }

    .preview pre {
      overflow: auto;
      border-radius: 6px;
      padding: 0.9rem;
      background: #1f2937;
      color: #e5e7eb;
    }

    .form-actions {
      /* 常驻底栏：长文章里不必翻到文末才能发布。依赖 .workspace 的 overflow: clip，见那里的注释。 */
      position: sticky;
      bottom: 0;
      z-index: 5;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      /* 负的左右边距抵消 .editor / .settings-panel 的 1.2rem padding，让底栏横向铺满；
         再用自身 padding 把按钮推回原来的对齐位置。背景必须不透明，否则正文会透出来。 */
      margin: 1rem -1.2rem 0;
      padding: 1rem 1.2rem;
      border-top: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 0 -6px 16px rgba(37, 45, 56, 0.06);
    }

    .form-actions .status {
      /* 状态文本不参与按钮那一行的空间竞争：flex-grow 会让长报错（GitHub 超时那种上百字符的）
         把底栏撑到视口四分之一高、按钮换行三排。占满整行、限高两行、超出用省略号，
         按钮行高度就与消息长度无关。完整信息仍在顶部 #status 里。 */
      flex: 1 0 100%;
      order: -1;
      min-width: 0;
      max-height: 2.6em;
      overflow: hidden;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .form-actions .status:empty {
      display: none;
    }

    .settings-panel {
      padding: 1.2rem;
    }

    .settings-panel h2 {
      margin: 0 0 1rem;
      font-size: 1.25rem;
    }

    .settings-section {
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--line);
    }

    .settings-section:last-child {
      border-bottom: 0;
    }

    @media (max-width: 960px) {
      .workspace,
      .editor-grid,
      .cover-row,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .article-list {
        min-height: auto;
        max-height: 320px;
        overflow: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <section id="loginView" class="login">
    <div class="login-panel">
      <h1>博客后台</h1>
      <form id="loginForm">
        <label for="adminToken">后台口令</label>
        <input id="adminToken" type="password" autocomplete="current-password" required>
        <button type="submit">登录</button>
        <div id="loginStatus" class="status"></div>
      </form>
    </div>
  </section>

  <main id="adminView" class="shell hidden">
    <header class="topbar">
      <h1>博客后台</h1>
      <button id="logoutBtn" class="secondary" type="button">退出</button>
    </header>

    <div class="toolbar">
      <button id="postsViewBtn" class="secondary view-button active" type="button">文章管理</button>
      <button id="settingsViewBtn" class="secondary view-button" type="button">站点设置</button>
      <button id="newPostBtn" type="button">新文章</button>
      <button id="refreshBtn" class="secondary" type="button">刷新</button>
      <button id="restoreDraftBtn" class="secondary hidden" type="button">恢复会话草稿</button>
      <button id="discardDraftBtn" class="secondary hidden" type="button">放弃会话草稿</button>
      <a id="frontLink" class="link-button secondary" href="/">返回前台</a>
      <span id="status" class="status"></span>
    </div>

    <section id="postsView" class="workspace">
      <aside id="articleList" class="article-list"></aside>

      <section class="editor">
        <div id="emptyState" class="empty">选择一篇文章，或者新建文章</div>

        <form id="editorForm" class="hidden">
          <input id="filePath" type="hidden">

          <div class="form-grid">
            <div class="field">
              <label for="title">标题</label>
              <input id="title" type="text" required>
            </div>
            <div class="field">
              <label for="date">日期</label>
              <input id="date" type="date" required>
            </div>
          </div>

          <div class="field">
            <label for="category">分类</label>
            <input id="category" list="categoryOptions" required>
            <datalist id="categoryOptions"></datalist>
          </div>

          <div class="field">
            <label>封面</label>
            <div class="cover-row">
              <div class="cover-preview"><img id="coverPreview" alt=""></div>
              <div>
                <input id="coverUrl" type="text" placeholder="/images/covers/defaults/fallback.webp">
                <div class="inline-actions spaced-above">
                  <button id="uploadCoverBtn" class="secondary" type="button">上传封面</button>
                  <button id="useDefaultCoverBtn" class="secondary" type="button">使用分类默认</button>
                </div>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="content">正文</label>
            <div class="inline-actions spaced-below">
              <button id="uploadContentImageBtn" class="secondary" type="button">插入图片</button>
              <button id="importMarkdownBtn" class="secondary" type="button">导入 Markdown</button>
            </div>
            <div class="editor-grid">
              <textarea id="content" required></textarea>
              <div id="preview" class="preview"></div>
            </div>
          </div>

          <div class="form-actions">
            <div class="inline-actions">
              <button id="saveBtn" type="submit">发布</button>
            </div>
            <span id="editorStatus" class="status"></span>
            <!-- 删除与取消同侧：底栏常驻后破坏性操作全程可点，靠与「发布」的距离防误点。 -->
            <div class="inline-actions">
              <button id="deleteBtn" class="danger hidden" type="button">删除</button>
              <button id="cancelBtn" class="secondary" type="button">取消</button>
            </div>
          </div>
        </form>
      </section>
    </section>

    <section id="settingsView" class="panel settings-panel hidden">
      <form id="settingsForm">
        <div class="settings-section">
          <h2>站点文本</h2>
          <div class="form-grid">
            <div class="field">
              <label for="settingTitle">站点标题</label>
              <input id="settingTitle" type="text" required>
            </div>
            <div class="field">
              <label for="settingSubtitle">站点副标题</label>
              <input id="settingSubtitle" type="text">
            </div>
          </div>
          <div class="field">
            <label for="settingSlogan">首页标语</label>
            <input id="settingSlogan" type="text">
          </div>
          <div class="field">
            <label for="settingFooter">页脚文本</label>
            <input id="settingFooter" type="text">
          </div>
        </div>

        <div class="settings-section">
          <h2>关于信息</h2>
          <div class="form-grid">
            <div class="field">
              <label for="settingAboutName">昵称</label>
              <input id="settingAboutName" type="text">
            </div>
            <div class="field">
              <label for="settingAboutIntro">简介</label>
              <input id="settingAboutIntro" type="text">
            </div>
          </div>
        </div>

        <div class="settings-section">
          <h2>导航名称</h2>
          <div class="form-grid">
            <div class="field">
              <label for="navHome">首页</label>
              <input id="navHome" type="text">
            </div>
            <div class="field">
              <label for="navArchive">归档</label>
              <input id="navArchive" type="text">
            </div>
            <div class="field">
              <label for="navCategory">分类</label>
              <input id="navCategory" type="text">
            </div>
            <div class="field">
              <label for="navAbout">关于</label>
              <input id="navAbout" type="text">
            </div>
            <div class="field">
              <label for="navLinks">友链</label>
              <input id="navLinks" type="text">
            </div>
            <div class="field">
              <label for="navGuestbook">留言</label>
              <input id="navGuestbook" type="text">
            </div>
          </div>
        </div>

        <div class="form-actions">
          <div class="inline-actions">
            <button id="saveSettingsBtn" type="submit">保存站点设置</button>
          </div>
          <span id="settingsStatus" class="status"></span>
          <div class="inline-actions">
            <button id="reloadSettingsBtn" class="secondary" type="button">重新读取</button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <input id="coverFile" class="hidden" type="file" accept="image/*">
  <input id="contentImageFile" class="hidden" type="file" accept="image/*">
  <input id="markdownFile" class="hidden" type="file" accept=".md,.markdown,text/markdown,text/plain">

  <script src="/admin/marked.min.js"></script>
  <script src="/admin/editor-tools.js"></script>
  <script>
    try { localStorage.removeItem('aoiblog_admin_token'); } catch (_) {}
    // 登录后只保留 HttpOnly 的 admin 会话 cookie（JS 读不到、8 小时过期），
    // 明文主口令不进 state：页面上任何一处 XSS 都不该能把永久凭据带走。
    const state = {
      articles: [],
      categories: [],
      coverMap: {},
      settings: null,
      current: null,
      coverTouched: false,
      articleBaseline: '',
      settingsBaseline: '',
      uploadedDuringDraft: false,
      pendingDraft: null,
      draftTimer: null
    };
    const editorTools = window.AoiAdminEditorTools;
    const DRAFT_KEY = 'aoiblog_admin_article_draft_v1';

    const $ = (id) => document.getElementById(id);

    function setStatus(message, target = null) {
      const text = message || '';
      if (target) {
        target.textContent = text;
        return;
      }
      // 顶部 #status 在工具栏，长文章里滚到编辑区底部时它已在视口外；
      // 两个 sticky 底栏各自镜像一份，保证「正在提交/已提交/报错」在手边可见。
      for (const id of ['status', 'editorStatus', 'settingsStatus']) {
        const node = $(id);
        if (node) node.textContent = text;
      }
    }

    function today() {
      const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(new Date()).map((part) => [part.type, part.value]));
      return `${parts.year}-${parts.month}-${parts.day}`;
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.success === false) {
        const error = new Error(data.error || `请求失败: ${response.status}`);
        error.status = response.status;
        if (response.status === 401) {
          persistDraftNow();
          showLogin();
          setStatus('会话已过期，请重新登录；当前文章草稿已保留。', $('loginStatus'));
        }
        throw error;
      }
      return data.data;
    }

    function showAdmin() {
      $('loginView').classList.add('hidden');
      $('adminView').classList.remove('hidden');
    }

    function showLogin() {
      $('adminView').classList.add('hidden');
      $('loginView').classList.remove('hidden');
    }

    async function loadAll() {
      setStatus('正在加载...');
      const categoriesData = await api('/api/adminArticles?view=categories');
      state.categories = categoriesData.categories || [];
      state.coverMap = categoriesData.coverMap || {};
      renderCategoryOptions();
      state.articles = await api('/api/adminArticles');
      renderArticles();
      setStatus(`已加载 ${state.articles.length} 篇文章`);
    }

    async function loadSettings() {
      setStatus('正在读取站点设置...');
      state.settings = await api('/api/adminSettings');
      renderSettings();
      setStatus('站点设置已读取');
    }

    function renderSettings() {
      const settings = state.settings || {};
      const nav = settings.nav || {};
      $('settingTitle').value = settings.title || '';
      $('settingSubtitle').value = settings.subtitle || '';
      $('settingSlogan').value = settings.slogan || '';
      $('settingFooter').value = settings.footerText || '';
      $('settingAboutName').value = settings.aboutName || '';
      $('settingAboutIntro').value = settings.aboutIntro || '';
      $('navHome').value = nav.home || '';
      $('navArchive').value = nav.archive || '';
      $('navCategory').value = nav.category || '';
      $('navAbout').value = nav.about || '';
      $('navLinks').value = nav.links || '';
      $('navGuestbook').value = nav.guestbook || '';
      state.settingsBaseline = JSON.stringify(settingsFormValues());
    }

    function settingsFormValues() {
      return {
        title: $('settingTitle').value.trim(),
        subtitle: $('settingSubtitle').value.trim(),
        slogan: $('settingSlogan').value.trim(),
        footerText: $('settingFooter').value.trim(),
        aboutName: $('settingAboutName').value.trim(),
        aboutIntro: $('settingAboutIntro').value.trim(),
        nav: {
          home: $('navHome').value.trim(),
          archive: $('navArchive').value.trim(),
          category: $('navCategory').value.trim(),
          about: $('navAbout').value.trim(),
          links: $('navLinks').value.trim(),
          guestbook: $('navGuestbook').value.trim()
        }
      };
    }

    function hasUnsavedSettings() {
      return !$('settingsView').classList.contains('hidden')
        && state.settingsBaseline
        && JSON.stringify(settingsFormValues()) !== state.settingsBaseline;
    }

    function confirmSettingsDiscard() {
      if (!hasUnsavedSettings()) return true;
      if (!confirm('站点设置尚未保存，确认放弃修改吗？')) return false;
      renderSettings();
      return true;
    }

    function showPostsView() {
      if (!confirmSettingsDiscard()) return;
      $('postsView').classList.remove('hidden');
      $('settingsView').classList.add('hidden');
      $('postsViewBtn').classList.add('active');
      $('settingsViewBtn').classList.remove('active');
      $('newPostBtn').classList.remove('hidden');
    }

    async function showSettingsView() {
      if (!confirmArticleDiscard()) return;
      closeEditor();
      $('postsView').classList.add('hidden');
      $('settingsView').classList.remove('hidden');
      $('postsViewBtn').classList.remove('active');
      $('settingsViewBtn').classList.add('active');
      $('newPostBtn').classList.add('hidden');

      if (!state.settings) {
        state.settingsBaseline = JSON.stringify(settingsFormValues());
        await loadSettings();
      }
    }

    async function saveSettings(event) {
      event.preventDefault();
      $('saveSettingsBtn').disabled = true;
      setStatus('正在保存站点设置...');

      try {
        state.settings = await api('/api/adminSettings', {
          method: 'POST',
          body: JSON.stringify({
            settings: settingsFormValues()
          })
        });
        renderSettings();
        setStatus('站点设置已提交到 GitHub，Vercel 会自动重新部署');
      } catch (error) {
        setStatus(error.message);
      } finally {
        $('saveSettingsBtn').disabled = false;
      }
    }

    function renderCategoryOptions() {
      $('categoryOptions').innerHTML = state.categories
        .map((category) => `<option value="${escapeHtml(category)}"></option>`)
        .join('');
    }

    function renderArticles() {
      if (!state.articles.length) {
        $('articleList').innerHTML = '<div class="empty">暂无文章</div>';
        return;
      }

      $('articleList').innerHTML = state.articles.map((article) => {
        const active = state.current?.filePath === article.filePath ? ' active' : '';
        return `
          <button class="article-item${active}" type="button" data-path="${escapeHtml(article.filePath)}">
            <span class="article-title">${escapeHtml(article.title)}</span>
            <span class="article-meta">${escapeHtml(String(article.date || '').slice(0, 10))} / ${escapeHtml(article.category || '')}</span>
          </button>
        `;
      }).join('');

      document.querySelectorAll('.article-item').forEach((item) => {
        item.addEventListener('click', () => editPost(item.dataset.path));
      });
    }

    function defaultCover(category) {
      return state.coverMap[category] || state.coverMap.default || '/images/covers/defaults/fallback.webp';
    }

    function updateCoverPreview() {
      const url = $('coverUrl').value.trim() || defaultCover($('category').value.trim());
      $('coverPreview').src = url;
    }

    function articleFormValues() {
      return {
        filePath: $('filePath').value,
        sha: state.current?.sha || '',
        title: $('title').value,
        date: $('date').value,
        category: $('category').value,
        index_img: $('coverUrl').value,
        content: $('content').value
      };
    }

    function articleFingerprint(article) {
      const source = article || {};
      return JSON.stringify({
        filePath: String(source.filePath || ''),
        sha: String(source.sha || ''),
        title: String(source.title || ''),
        date: String(source.date || '').slice(0, 10),
        category: String(source.category || ''),
        index_img: String(source.index_img || ''),
        content: String(source.content || '')
      });
    }

    function hasUnsavedArticle() {
      return !$('editorForm').classList.contains('hidden')
        && state.articleBaseline
        && (state.uploadedDuringDraft
          || articleFingerprint(articleFormValues()) !== state.articleBaseline);
    }

    function storedDraft() {
      try {
        return editorTools.parseSessionDraft(sessionStorage.getItem(DRAFT_KEY));
      } catch {
        return null;
      }
    }

    function updateDraftButtons() {
      const visible = Boolean(state.pendingDraft);
      $('restoreDraftBtn').classList.toggle('hidden', !visible);
      $('discardDraftBtn').classList.toggle('hidden', !visible);
    }

    function clearDraft() {
      if (state.draftTimer) clearTimeout(state.draftTimer);
      state.draftTimer = null;
      try { sessionStorage.removeItem(DRAFT_KEY); } catch (_) {}
      state.pendingDraft = null;
      state.uploadedDuringDraft = false;
      updateDraftButtons();
    }

    function persistDraftNow() {
      if (state.draftTimer) clearTimeout(state.draftTimer);
      state.draftTimer = null;
      if (!hasUnsavedArticle()) {
        if (!state.pendingDraft) {
          try { sessionStorage.removeItem(DRAFT_KEY); } catch (_) {}
        }
        return;
      }
      const draft = editorTools.createSessionDraft(articleFormValues(), state.uploadedDuringDraft);
      try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch (_) {}
    }

    function scheduleDraft() {
      if (state.draftTimer) clearTimeout(state.draftTimer);
      state.draftTimer = setTimeout(persistDraftNow, 350);
    }

    function applyDraft(draft) {
      $('filePath').value = draft.filePath;
      $('title').value = draft.title;
      $('date').value = draft.date;
      $('category').value = draft.category;
      $('coverUrl').value = draft.index_img;
      $('content').value = draft.content;
      state.uploadedDuringDraft = draft.uploaded;
      state.coverTouched = true;
      updateCoverPreview();
      updatePreview();
      persistDraftNow();
    }

    function confirmArticleDiscard() {
      if (!hasUnsavedArticle() && !state.pendingDraft) return true;
      if (hasUnsavedArticle()) persistDraftNow();
      const draft = state.pendingDraft?.draft || storedDraft() || editorTools.createSessionDraft(
        articleFormValues(),
        state.uploadedDuringDraft
      );
      if (!confirm(editorTools.draftDiscardMessage(draft))) return false;
      clearDraft();
      return true;
    }

    async function restoreSessionDraft() {
      const draft = storedDraft();
      if (!draft) return;
      let remote = null;
      if (draft.filePath) {
        try {
          remote = await api(`/api/adminArticles?filePath=${encodeURIComponent(draft.filePath)}`);
        } catch (error) {
          if (error.status === 401) return;
        }
      } else {
        remote = {
          filePath: '',
          sha: '',
          title: '',
          date: today(),
          category: state.categories[0] || '',
          index_img: '',
          content: ''
        };
      }

      if (editorTools.draftRestoreState(draft, remote) === 'restore') {
        showEditor(remote);
        applyDraft(draft);
        setStatus('已恢复当前标签页中的会话草稿。');
        return;
      }

      state.pendingDraft = { draft, remote };
      updateDraftButtons();
      setStatus('检测到会话草稿，但远端文章已变化；请先复制内容，或明确恢复冲突草稿。');
    }

    function showEditor(article = null) {
      state.current = article;
      state.coverTouched = Boolean(article?.index_img && article.index_img !== defaultCover(article.category));
      $('emptyState').classList.add('hidden');
      $('editorForm').classList.remove('hidden');
      $('deleteBtn').classList.toggle('hidden', !article?.filePath);
      $('filePath').value = article?.filePath || '';
      $('title').value = article?.title || '';
      $('date').value = String(article?.date || today()).slice(0, 10);
      $('category').value = article?.category || state.categories[0] || '';
      $('coverUrl').value = article?.index_img || defaultCover($('category').value);
      $('content').value = article?.content || '';
      updateCoverPreview();
      updatePreview();
      state.uploadedDuringDraft = false;
      state.articleBaseline = articleFingerprint({
        filePath: article?.filePath || '',
        sha: article?.sha || '',
        title: article?.title || '',
        date: String(article?.date || today()).slice(0, 10),
        category: article?.category || state.categories[0] || '',
        index_img: article?.index_img || defaultCover(article?.category || state.categories[0] || ''),
        content: article?.content || ''
      });
      renderArticles();
    }

    async function editPost(filePath) {
      if (state.current?.filePath === filePath) return;
      if (!confirmArticleDiscard()) return;
      try {
        setStatus('正在打开文章...');
        const article = await api(`/api/adminArticles?filePath=${encodeURIComponent(filePath)}`);
        showEditor(article);
        setStatus('文章已打开');
      } catch (error) {
        setStatus(error.message);
      }
    }

    function newPost() {
      if (!confirmArticleDiscard()) return;
      showEditor({
        title: '',
        date: today(),
        category: state.categories[0] || '',
        index_img: '',
        content: ''
      });
      $('title').focus();
    }

    function closeEditor() {
      state.current = null;
      state.articleBaseline = '';
      $('editorForm').classList.add('hidden');
      $('emptyState').classList.remove('hidden');
      renderArticles();
    }

    function hideEditor() {
      if (!confirmArticleDiscard()) return;
      closeEditor();
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function safeMarkdownUrl(value) {
      return editorTools.safeMarkdownUrl(value);
    }

    function renderMarkdown(markdown) {
      const codeBlocks = [];
      let html = String(markdown || '').replace(/```([\s\S]*?)```/g, (_, code) => {
        codeBlocks.push(`<pre><code>${escapeHtml(code.trim())}</code></pre>`);
        return `@@CODE_BLOCK_${codeBlocks.length - 1}@@`;
      });

      html = escapeHtml(html)
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h2>$1</h2>')
        .replace(/^# (.+)$/gm, '<h1>$1</h1>')
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,
          (_, alt, url) => `<img src="${safeMarkdownUrl(url)}" alt="${alt}">`)
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g,
          (_, text, url) => `<a href="${safeMarkdownUrl(url)}" target="_blank" rel="noopener noreferrer">${text}</a>`)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\n{2,}/g, '</p><p>')
        .replace(/\n/g, '<br>');

      html = `<p>${html}</p>`.replace(/<p>\s*<\/p>/g, '');
      codeBlocks.forEach((block, index) => {
        // 用函数形式回填：字符串形式会让代码块里的 $&、$`、$' 被当成替换模式展开。
        html = html.replace(`@@CODE_BLOCK_${index}@@`, () => block);
      });
      return html;
    }

    function updatePreview() {
      $('preview').innerHTML = renderMarkdown($('content').value);
    }

    function applyEditorReplacement(replacement) {
      if (!replacement) return false;
      const textarea = $('content');
      textarea.value = replacement.value;
      textarea.selectionStart = replacement.selectionStart;
      textarea.selectionEnd = replacement.selectionEnd;
      updatePreview();
      scheduleDraft();
      return true;
    }

    function insertAtCursor(text) {
      const textarea = $('content');
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
      textarea.focus();
      textarea.selectionStart = textarea.selectionEnd = start + text.length;
      updatePreview();
      scheduleDraft();
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    // Vercel Serverless Function 请求体硬上限为 4.5MB，超限直接 413，
    // 请求进不到函数代码。base64 会让载荷膨胀约 33%，故把压缩后的图片
    // 字节控制在约 3.2MB 以内，留足余量。
    const UPLOAD_BLOB_BUDGET = 3.2 * 1024 * 1024;

    // 老版 Safari 不支持 WebP 编码，此处探测后回退 JPEG。
    const OUTPUT_TYPE = (() => {
      const c = document.createElement('canvas');
      return c.toDataURL('image/webp').startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg';
    })();
    const OUTPUT_EXT = OUTPUT_TYPE === 'image/webp' ? 'webp' : 'jpg';

    function isAnimatedType(file) {
      return /gif$/i.test(file.type) || /\.gif$/i.test(file.name);
    }

    function canvasToBlob(canvas, type, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(blob => (blob ? resolve(blob) : reject(new Error('图片压缩失败，请换一张'))), type, quality);
      });
    }

    async function compressImage(file, maxDim) {
      const url = URL.createObjectURL(file);
      try {
        const img = new Image();
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error('图片无法解码，请换一张'));
          img.src = url;
        });

        const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
        let width = Math.max(1, Math.round(img.naturalWidth * scale));
        let height = Math.max(1, Math.round(img.naturalHeight * scale));
        let quality = 0.85;

        for (let attempt = 0; attempt < 8; attempt++) {
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          if (OUTPUT_TYPE === 'image/jpeg') {
            // JPEG 无透明通道，先铺白底，避免透明区域变黑。
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
          }
          ctx.drawImage(img, 0, 0, width, height);

          const blob = await canvasToBlob(canvas, OUTPUT_TYPE, quality);
          if (blob.size <= UPLOAD_BLOB_BUDGET) return blob;

          // 仍超预算：先降画质，触底后再缩尺寸。
          if (quality > 0.5) {
            quality -= 0.12;
          } else {
            width = Math.max(1, Math.round(width * 0.85));
            height = Math.max(1, Math.round(height * 0.85));
          }
        }
        throw new Error('图片压缩后仍过大，请换一张更小的图');
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    async function uploadImage(file, purpose) {
      const maxDim = purpose === 'cover' ? 1920 : 1600;
      let dataUrl;
      let fileName = file.name;

      if (isAnimatedType(file)) {
        // GIF 走 canvas 会丢动画，原样上传，仅做体积拦截。
        if (file.size > UPLOAD_BLOB_BUDGET) {
          throw new Error('GIF 体积过大（需小于约 3MB），请压缩后再传');
        }
        dataUrl = await readFileAsDataUrl(file);
      } else {
        const blob = await compressImage(file, maxDim);
        dataUrl = await readFileAsDataUrl(blob);
        fileName = file.name.replace(/\.[^.]+$/, '') + '.' + OUTPUT_EXT;
      }

      const result = await api('/api/adminUpload', {
        method: 'POST',
        body: JSON.stringify({
          purpose,
          fileName,
          dataUrl
        })
      });
      // 返回的 url 指向刚提交、尚未部署的静态文件，Vercel 重建前请求会 404；
      // 一并带上本地压缩结果供上传后即时预览。
      return { ...result, previewDataUrl: dataUrl };
    }

    async function savePost(event) {
      event.preventDefault();
      const saveBtn = $('saveBtn');
      saveBtn.disabled = true;
      setStatus('正在提交...');

      try {
        const article = {
          filePath: $('filePath').value,
          sha: state.current?.sha || '',
          title: $('title').value.trim(),
          date: $('date').value,
          category: $('category').value.trim(),
          index_img: $('coverUrl').value.trim(),
          content: $('content').value
        };

        const saved = await api('/api/adminArticles', {
          method: 'POST',
          body: JSON.stringify({ article })
        });

        setStatus('已提交到 GitHub，Vercel 会自动重新部署');
        clearDraft();
        state.current = saved;
        await loadAll();
        showEditor(saved);
      } catch (error) {
        setStatus(error.message);
      } finally {
        saveBtn.disabled = false;
      }
    }

    async function deleteCurrentPost() {
      if (!state.current?.filePath) return;
      if (!confirm(`确认删除《${state.current.title}》？`)) return;

      $('deleteBtn').disabled = true;
      setStatus('正在删除...');

      try {
        await api('/api/adminArticles', {
          method: 'DELETE',
          body: JSON.stringify({ filePath: state.current.filePath, sha: state.current.sha })
        });
        clearDraft();
        state.articleBaseline = articleFingerprint(articleFormValues());
        hideEditor();
        await loadAll();
        setStatus('文章已删除');
      } catch (error) {
        setStatus(error.message);
      } finally {
        $('deleteBtn').disabled = false;
      }
    }

    $('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const field = $('adminToken');
      const token = field.value.trim();
      setStatus('正在登录...', $('loginStatus'));

      try {
        const sessionResponse = await fetch('/api/adminSession', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        if (sessionResponse.status === 429) throw new Error('尝试过多，请稍后再试');
        if (!sessionResponse.ok) throw new Error('后台口令错误');
        field.value = '';
        showAdmin();
        setStatus('', $('loginStatus'));
      } catch (error) {
        showLogin();
        setStatus(error.message, $('loginStatus'));
        return;
      }

      try {
        await loadAll();
        await restoreSessionDraft();
      } catch (error) {
        if (error.status !== 401) {
          showAdmin();
          setStatus(`登录成功，但文章列表加载失败：${error.message}。请点击刷新重试。`);
        }
      }
    });

    $('logoutBtn').addEventListener('click', async () => {
      if (!confirmArticleDiscard() || !confirmSettingsDiscard()) return;
      await fetch('/api/adminSession', { method: 'DELETE', credentials: 'same-origin' }).catch(() => {});
      showLogin();
    });

    $('refreshBtn').addEventListener('click', () => {
      loadAll().catch((error) => setStatus(`加载失败：${error.message}。请重试。`));
    });
    $('postsViewBtn').addEventListener('click', showPostsView);
    $('settingsViewBtn').addEventListener('click', () => {
      showSettingsView().catch((error) => setStatus(`站点设置加载失败：${error.message}。请重试。`));
    });
    $('settingsForm').addEventListener('submit', saveSettings);
    $('reloadSettingsBtn').addEventListener('click', () => {
      if (confirmSettingsDiscard()) loadSettings().catch((error) => setStatus(error.message));
    });
    $('newPostBtn').addEventListener('click', newPost);
    $('cancelBtn').addEventListener('click', hideEditor);
    $('editorForm').addEventListener('submit', savePost);
    $('deleteBtn').addEventListener('click', deleteCurrentPost);
    for (const id of ['title', 'date']) {
      $(id).addEventListener('input', scheduleDraft);
    }
    $('content').addEventListener('input', () => {
      updatePreview();
      scheduleDraft();
    });
    $('content').addEventListener('keydown', (event) => {
      if (
        event.key !== 'Enter'
        || event.isComposing
        || event.ctrlKey
        || event.altKey
        || event.metaKey
      ) return;

      const textarea = event.currentTarget;
      const replacement = editorTools.editorEnterReplacement({
        value: textarea.value,
        selectionStart: textarea.selectionStart,
        selectionEnd: textarea.selectionEnd,
        shiftKey: event.shiftKey
      });
      event.preventDefault();
      applyEditorReplacement(replacement);
    });
    $('content').addEventListener('paste', (event) => {
      const textarea = event.currentTarget;
      const replacement = editorTools.wordPasteReplacement({
        html: event.clipboardData?.getData('text/html') || '',
        text: event.clipboardData?.getData('text/plain') || '',
        value: textarea.value,
        selectionStart: textarea.selectionStart,
        selectionEnd: textarea.selectionEnd
      });
      if (!replacement) return;
      event.preventDefault();
      applyEditorReplacement(replacement);
    });
    $('coverUrl').addEventListener('input', () => {
      state.coverTouched = true;
      updateCoverPreview();
      scheduleDraft();
    });
    $('category').addEventListener('input', () => {
      if (!state.coverTouched) {
        $('coverUrl').value = defaultCover($('category').value.trim());
      }
      updateCoverPreview();
      scheduleDraft();
    });

    $('useDefaultCoverBtn').addEventListener('click', () => {
      state.coverTouched = false;
      $('coverUrl').value = defaultCover($('category').value.trim());
      updateCoverPreview();
      scheduleDraft();
    });

    $('uploadCoverBtn').addEventListener('click', () => $('coverFile').click());
    $('uploadContentImageBtn').addEventListener('click', () => $('contentImageFile').click());
    $('importMarkdownBtn').addEventListener('click', () => $('markdownFile').click());

    $('coverFile').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      setStatus('正在上传封面...');

      try {
        const image = await uploadImage(file, 'cover');
        state.uploadedDuringDraft = true;
        $('coverUrl').value = image.url;
        state.coverTouched = true;
        // 用本地压缩结果即时预览，避免请求尚未部署的线上路径导致破图。
        $('coverPreview').src = image.previewDataUrl;
        scheduleDraft();
        setStatus('封面已上传，部署完成后线上生效');
      } catch (error) {
        setStatus(error.message);
      } finally {
        event.target.value = '';
      }
    });

    $('contentImageFile').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      setStatus('正在上传图片...');

      try {
        const image = await uploadImage(file, 'content');
        state.uploadedDuringDraft = true;
        insertAtCursor(`\n![${file.name}](${image.url})\n`);
        setStatus('图片已插入');
      } catch (error) {
        setStatus(error.message);
      } finally {
        event.target.value = '';
      }
    });

    $('markdownFile').addEventListener('change', async (event) => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const replacement = editorTools.markdownImportReplacement({
          source: await file.text(),
          title: $('title').value
        });
        $('title').value = replacement.title;
        $('content').value = replacement.value;
        updatePreview();
        scheduleDraft();
        setStatus('Markdown 已导入');
      } catch (error) {
        setStatus(`Markdown 导入失败：${error.message}`);
      } finally {
        event.target.value = '';
      }
    });

    $('restoreDraftBtn').addEventListener('click', () => {
      const pending = state.pendingDraft;
      if (!pending) return;
      if (!confirm('远端文章已经变化。明确恢复会用草稿内容覆盖编辑器，请确认已复制需要保留的远端内容。')) return;
      showPostsView();
      showEditor(pending.remote || {
        filePath: pending.draft.filePath,
        sha: '',
        title: '',
        date: today(),
        category: state.categories[0] || '',
        index_img: '',
        content: ''
      });
      applyDraft(pending.draft);
      state.pendingDraft = null;
      updateDraftButtons();
      setStatus('已明确恢复冲突草稿；保存前请再次核对远端变化。');
    });

    $('discardDraftBtn').addEventListener('click', () => {
      const draft = state.pendingDraft?.draft;
      if (!draft) return;
      if (!confirm(editorTools.draftDiscardMessage(draft))) return;
      clearDraft();
      setStatus('会话草稿已放弃。');
    });

    $('frontLink').addEventListener('click', (event) => {
      if (confirmArticleDiscard() && confirmSettingsDiscard()) return;
      event.preventDefault();
    });

    window.addEventListener('beforeunload', (event) => {
      if (!hasUnsavedArticle() && !state.pendingDraft && !hasUnsavedSettings()) return;
      persistDraftNow();
      event.preventDefault();
      event.returnValue = '';
    });

    // 会话在 cookie 里，刷新页面不该被踢回登录框。
    (async () => {
      showLogin();
      try {
        const response = await fetch('/api/adminSession', { credentials: 'same-origin' });
        if (!response.ok) return;
        showAdmin();
        await loadAll();
        await restoreSessionDraft();
      } catch (error) {
        if (error?.status === 401) return;
        showAdmin();
        setStatus(`文章列表加载失败：${error.message || '未知错误'}。请点击刷新重试。`);
      }
    })();
  </script>
</body>
</html>
